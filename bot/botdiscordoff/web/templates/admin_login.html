<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Admin - Miaouscle Bot</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0b0e14; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; color: #e0e0e0; }
        .login-card { background: #11141b; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 400px; border: 1px solid rgba(255,255,255,0.1); }
        .login-card h2 { text-align: center; margin-bottom: 2rem; color: #f87171; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
        .form-group input { width: 100%; padding: 0.8rem; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: white; box-sizing: border-box; }
        .form-group input:focus { outline: none; border-color: #6366f1; }
        .btn { width: 100%; padding: 0.8rem; border: none; border-radius: 6px; background: #6366f1; color: white; font-weight: 700; cursor: pointer; transition: background 0.3s; }
        .btn:hover { background: #4f46e5; }
        .error { background: rgba(239, 68, 68, 0.2); color: #ef4444; padding: 0.8rem; border-radius: 6px; margin-bottom: 1.5rem; border: 1px solid #ef4444; text-align: center; }
        .back-link { display: block; text-align: center; margin-top: 1.5rem; color: #a0aec0; text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { color: white; }
    </style>
</head>
<body>
    <div class="login-card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div style="font-size: 3.5rem; margin-bottom: 0.5rem;">👑</div>
            <h2 style="margin: 0; color: #f87171; font-size: 1.8rem;">Accès Admin</h2>
            <p style="color: #a0aec0; font-size: 0.9rem; margin-top: 0.5rem;">Espace réservé à l'administrateur matix</p>
        </div>
        
        {% if error %}
            <div class="error">
                <span style="font-weight: bold;">⚠️ Erreur :</span> {{ error }}
            </div>
        {% endif %}
        
        <form method="POST">
            <div class="form-group">
                <label for="admin_id">👤 Identifiant Admin</label>
                <input type="text" id="admin_id" name="admin_id" placeholder="Entrez votre ID..." required autofocus>
            </div>
            <div class="form-group">
                <label for="admin_pwd">🔒 Mot de passe</label>
                <input type="password" id="admin_pwd" name="admin_pwd" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn">DÉVERROUILLER L'ACCÈS</button>
        </form>
        
        <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.05); text-align: center;">
            <a href="/" class="back-link">← Retour au site public</a>
        </div>
    </div>
</body>
</html>
