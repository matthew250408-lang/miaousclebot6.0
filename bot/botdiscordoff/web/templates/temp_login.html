<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Temporaire - Miaouscle Bot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #1a1a3e 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: linear-gradient(145deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.03) 100%);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            border-radius: 14px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            max-width: 420px;
            width: 90%;
            border: 1px solid rgba(255,255,255,0.12);
        }
        .icon { text-align: center; font-size: 3rem; margin-bottom: 0.5rem; }
        h1 { color: #fff; text-align: center; font-size: 1.4rem; margin-bottom: 0.3rem; }
        .subtitle { color: rgba(255,255,255,0.5); text-align: center; font-size: 0.85rem; margin-bottom: 1.8rem; }
        .error {
            background: rgba(239,68,68,0.15);
            color: #f87171;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.2rem;
            border: 1px solid rgba(248,113,113,0.3);
            font-size: 0.9rem;
        }
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: 0.4rem; color: rgba(255,255,255,0.8); font-size: 0.85rem; font-weight: 600; letter-spacing: 0.03em; }
        input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            font-size: 1rem;
            background: rgba(255,255,255,0.06);
            color: #fff;
            transition: border-color 0.2s;
        }
        input::placeholder { color: rgba(255,255,255,0.3); }
        input:focus { outline: none; border-color: #667eea; background: rgba(255,255,255,0.09); }
        .btn {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 0.5rem;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .info-box {
            background: rgba(102,126,234,0.1);
            border: 1px solid rgba(102,126,234,0.3);
            border-radius: 8px;
            padding: 0.9rem 1rem;
            margin-top: 1.2rem;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.6);
            line-height: 1.5;
        }
        .info-box strong { color: rgba(255,255,255,0.85); }
        .back { text-align: center; margin-top: 1rem; }
        .back a { color: rgba(255,255,255,0.4); text-decoration: none; font-size: 0.85rem; }
        .back a:hover { color: rgba(255,255,255,0.7); }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔐</div>
        <h1>Session Temporaire</h1>
        <p class="subtitle">Entrez vos identifiants fournis par l'administrateur</p>

        {% if error %}
        <div class="error">⚠️ {{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label>🆔 ID de Session</label>
                <input type="text" name="session_id" required placeholder="Ex: ABC123DEF456" autocomplete="off" style="text-transform: uppercase; letter-spacing: 0.1em; font-family: monospace;">
            </div>
            <div class="form-group">
                <label>🔑 Mot de Passe</label>
                <input type="password" name="password" required placeholder="Votre mot de passe" autocomplete="off">
            </div>
            <button class="btn" type="submit">🚀 Se Connecter</button>
        </form>

        <div class="info-box">
            <strong>ℹ️ Note :</strong> Les sessions temporaires sont créées par l'admin du bot.
            Si tu viens de recevoir tes identifiants, attends <strong>2 minutes</strong> avant de te connecter.
        </div>

        <div class="back">
            <a href="/">← Retour à l'accueil</a>
        </div>
    </div>
    <script>
        const idInput = document.querySelector('input[name="session_id"]');
        if (idInput) idInput.addEventListener('input', function() {
            this.value = this.value.toUpperCase();
        });
    </script>
</body>
</html>
